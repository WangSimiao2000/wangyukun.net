<h1>吹散多少梦</h1>
<p class="form-tag">点绛唇</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">微醉年华，</span><span class="ph">小楼酒伴残宵纵。</span><span class="ph">不觉沉重，</span><span class="ph">吹散多少梦。</span></span><span class="ln"><span class="ph">去岁光阴，</span><span class="ph">一夜轻弹弄。</span><span class="ph">芳草动，</span><span class="ph">试留无用，</span><span class="ph">梅落春风送。</span></span></p></div>
<p class="sig">— YK</p>
