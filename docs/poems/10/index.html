<h1>宁远城</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">冽冽悲风战地寒，</span><span class="ph">萋萋草木落花残。</span></span><span class="ln"><span class="ph">横刀立马烽烟散，</span><span class="ph">竖戟弯弓堡塞安。</span></span><span class="ln"><span class="ph">一矢城垣镶胆魄，</span><span class="ph">九边镇卫锁关山。</span></span><span class="ln"><span class="ph">英名翰墨铮铮骨，</span><span class="ph">浩气丹青代代传。</span></span></p></div>
<p class="sig">— YK</p>
