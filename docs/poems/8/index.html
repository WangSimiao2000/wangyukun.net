<h1>半路秋梦</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">剑胆穿云暮雨垂，</span><span class="ph">琴心散雾晚风吹。</span></span><span class="ln"><span class="ph">青衫侠骨红尘醉，</span><span class="ph">皓月柔肠紫陌随。</span></span><span class="ln"><span class="ph">婉婉流泉成水韵，</span><span class="ph">苍苍古道入山楣。</span></span><span class="ln"><span class="ph">长街零落阑珊影，</span><span class="ph">短梦依稀缱绻帷。</span></span></p></div>
<p class="sig">— YK</p>
