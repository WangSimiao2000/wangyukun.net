<h1>青江芦</h1>
<p class="form-tag">踏莎行</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">淡黛描妆，</span><span class="ph">轻烟拢雾。</span><span class="ph">云湖似梦何人住。</span></span><span class="ln"><span class="ph">携来山外揽清风，</span><span class="ph">潇潇一笔峨眉赋。</span></span></p><p class="stanza"><span class="ln"><span class="ph">夜雨愁停，</span><span class="ph">霞光晚露。</span><span class="ph">青江水韵孤舟渡。</span></span><span class="ln"><span class="ph">南桥酒肆话沉浮，</span><span class="ph">曾经侧畔千帆处。</span></span></p></div>
<p class="sig">— YK</p>
