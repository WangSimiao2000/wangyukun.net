<h1>沫水钓月</h1>
<p class="form-tag">双雁儿</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">平羌细雨入寒秋。</span><span class="ph">媚柳岸、</span><span class="ph">紫兰楼。</span></span><span class="ln"><span class="ph">桂香才露几分羞。</span><span class="ph">暮云惆、</span><span class="ph">箬笠舟。</span></span><span class="ln"><span class="ph">映天沧浪看江鸥。</span><span class="ph">钓月酒、</span><span class="ph">醉箜篌。</span></span><span class="ln"><span class="ph">砚田耕作晚风悠。</span><span class="ph">且听凭、</span><span class="ph">沫水流。</span></span></p></div>
<p class="sig">— YK</p>
