<h1>圆明园</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">西山玉辇对榱椽，</span><span class="ph">帝苑鸾旗向柳烟。</span></span><span class="ln"><span class="ph">画栋离宫临翠泊，</span><span class="ph">雕梁楼阁傍甘泉。</span></span><span class="ln"><span class="ph">瑶台涟水迢迢地，</span><span class="ph">蓬岛秋风瑟瑟天。</span></span><span class="ln"><span class="ph">一曲虞韶新月下，</span><span class="ph">两行愁赋旧池边。</span></span></p></div>
<p class="sig">— YK</p>
