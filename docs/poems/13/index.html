<h1>太湖风云</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">玉笛悠悠望汉宫，</span><span class="ph">紫萧脉脉贯长空。</span></span><span class="ln"><span class="ph">连天碧水芳堤暗，</span><span class="ph">满地青烟细柳胧。</span></span><span class="ln"><span class="ph">万里黄沙金甲梦，</span><span class="ph">千秋越梓太湖东。</span></span><span class="ln"><span class="ph">云浮铁马琵琶雨，</span><span class="ph">月照冰河鼓瑟风。</span></span></p></div>
<p class="sig">— YK</p>
