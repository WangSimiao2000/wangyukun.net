<h1>三星社</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">八月秋高稻黍黄，</span><span class="ph">三星社里桂枝香。</span></span><span class="ln"><span class="ph">青杉柳下飞莺叫，</span><span class="ph">绿水滩头白鹭忙。</span></span><span class="ln"><span class="ph">雁字排开才入梦，</span><span class="ph">清风染指又斜阳。</span></span><span class="ln"><span class="ph">红旗跃进东门路，</span><span class="ph">异彩纷呈遍地妆。</span></span></p></div>
<p class="sig">— YK</p>
