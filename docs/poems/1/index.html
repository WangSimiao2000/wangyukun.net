<h1>梦回楼兰</h1>
<p class="form-tag">新诗</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">踏着唐诗宋词的韵脚</span></span><span class="ln"><span class="ph">沉醉于烟雨江南</span></span><span class="ln"><span class="ph">青砖黛瓦亭榭</span></span><span class="ln"><span class="ph">小桥流水人家</span></span><span class="ln"><span class="ph">可总梦幻般牵挂着</span></span><span class="ln"><span class="ph">那一场千年的邂逅</span></span><span class="ln"><span class="ph">在无垠的大漠深处</span></span><span class="ln"><span class="ph">在漫天黄沙飞舞之中</span></span><span class="ln"><span class="ph">去拥抱那</span></span><span class="ln"><span class="ph">尚未睡醒的楼兰</span></span></p><p class="stanza"><span class="ln"><span class="ph">胡杨，</span><span class="ph">羌笛</span></span><span class="ln"><span class="ph">孤傲，</span><span class="ph">妩媚</span></span><span class="ln"><span class="ph">撩人眼泪</span></span><span class="ln"><span class="ph">深情款款</span></span><span class="ln"><span class="ph">站上西风吹拂的城头</span></span><span class="ln"><span class="ph">抚摸那城里城外的暮色</span></span><span class="ln"><span class="ph">聆听一路驼铃</span></span><span class="ln"><span class="ph">吟千年前的盛况绝响</span></span><span class="ln"><span class="ph">叹千年后的大漠孤烟</span></span></p><p class="stanza"><span class="ln"><span class="ph">秦时月，</span><span class="ph">汉时关</span></span><span class="ln"><span class="ph">悲歌千年梦楼兰</span></span><span class="ln"><span class="ph">青海长云暗雪山</span></span><span class="ln"><span class="ph">孤城遥望玉门关</span></span><span class="ln"><span class="ph">烟沙大漠迷蒙</span></span><span class="ln"><span class="ph">千载楼兰乍现</span></span><span class="ln"><span class="ph">扬起的是穿越时空的思绪</span></span><span class="ln"><span class="ph">沉淀的是滚滚长河的波澜</span></span></p></div>
<p class="sig">— YK</p>
