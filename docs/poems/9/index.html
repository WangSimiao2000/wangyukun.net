<h1>江月照西原</h1>
<p class="form-tag">浪淘沙</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">云雾挂峰峦。</span><span class="ph">如画山川。</span></span><span class="ln"><span class="ph">长风化雪酿霜天。</span><span class="ph">料峭涧流摇日线，</span><span class="ph">水抱槐烟。</span></span></p><p class="stanza"><span class="ln"><span class="ph">汉邑黛眉间。</span><span class="ph">独笔琴弦。</span></span><span class="ln"><span class="ph">一弯江月照西原。</span><span class="ph">桃叶赋歌斟满酒，</span><span class="ph">饮尽千年。</span></span></p></div>
<p class="sig">— YK</p>
