<h1>倒淌河赋</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">思唐泪上绛云羞，</span><span class="ph">日月山前绿水柔。</span></span><span class="ln"><span class="ph">十里银滩风破夏，</span><span class="ph">八方逸客笔迎秋。</span></span><span class="ln"><span class="ph">金樽潋滟熏香地，</span><span class="ph">夜色空濛摘艳州。</span></span><span class="ln"><span class="ph">一剪时光留不住，</span><span class="ph">三分酒意去闲愁。</span></span></p></div>
<p class="sig">— YK</p>
