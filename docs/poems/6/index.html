<h1>镜花如梦</h1>
<p class="form-tag">霜天晓角</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">检点飞光。</span><span class="ph">品千载华章。</span><span class="ph">燕马青丝年少，</span><span class="ph">洛阳玉、</span><span class="ph">换琼觞。</span></span></p><p class="stanza"><span class="ln"><span class="ph">望三秋待妆。</span><span class="ph">断七弦未央。</span><span class="ph">轻叹镜花如梦，</span><span class="ph">空沈魅、</span><span class="ph">在何方？</span></span></p></div>
<p class="sig">— YK</p>
</article>
