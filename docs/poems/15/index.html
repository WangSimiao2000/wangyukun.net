<h1>煎茶荷香</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">舞月芙蓉新雨后，</span><span class="ph">罗裙盈动入沙洲。</span></span><span class="ln"><span class="ph">煎茶小榭湖光透，</span><span class="ph">一色幽幽满眼收。</span></span><span class="ln"><span class="ph">画得莲蓬妆绿圃，</span><span class="ph">抽丝玉藕映荷沟。</span></span><span class="ln"><span class="ph">香消总被秋风瘦，</span><span class="ph">莫待春来忆旧愁。</span></span></p></div>
<p class="sig">— YK</p>
