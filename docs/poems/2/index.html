<h1>岁月如故</h1>
<p class="form-tag">木笪</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">晓来枝上露。</span><span class="ph">天暗林中雾。</span><span class="ph">八月蛾黄香满树。</span><span class="ph">飞莺芦荻醉，</span><span class="ph">一江秋暮。</span></span></p><p class="stanza"><span class="ln"><span class="ph">落花津渡。</span><span class="ph">霞染长亭处。</span><span class="ph">总是光阴留不住。</span><span class="ph">浮云穿指漏，</span><span class="ph">柳岸如故。</span></span></p></div>
<p class="sig">— YK</p>
