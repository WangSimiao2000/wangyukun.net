<h1>漠外盘雕</h1>
<p class="form-tag">鹧鸪天</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">袅雁潇潇槲叶飘，</span><span class="ph">铁蹄激荡驿墙高。</span></span><span class="ln"><span class="ph">狂歌笙乐何时住，</span><span class="ph">星月金盔嗜血刀。</span></span><span class="ln"><span class="ph">饮尽酒，</span><span class="ph">踏胡巢。</span><span class="ph">几曾回望戏江滔。</span></span><span class="ln"><span class="ph">枳花罢后秋风路，</span><span class="ph">当自扬鞭问大雕。</span></span></p></div>
<p class="sig">— YK</p>
