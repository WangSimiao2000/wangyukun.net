<h1>紫禁红墙</h1>
<p class="form-tag">七律</p>
<div class="body"><p class="stanza"><span class="ln"><span class="ph">壮阔风云多浩荡，</span><span class="ph">流觞冷韵少沧桑。</span></span><span class="ln"><span class="ph">秋霜瑟瑟波澜急，</span><span class="ph">落日潇潇血色凉。</span></span><span class="ln"><span class="ph">紫禁城头斑驳印，</span><span class="ph">梧桐树下梦残阳。</span></span><span class="ln"><span class="ph">今朝犹叹萧墙月，</span><span class="ph">几度妆容谢燕堂。</span></span></p></div>
<p class="sig">— YK</p>
